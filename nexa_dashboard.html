<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXA Market & Showroom Intelligence Dashboard</title>
<style>
:root{--bg:#f2f5fa;--card:#fff;--ink:#14213d;--mut:#667085;--line:#e3e8ef;--acc:#1b4fd8;--soft:#9db4f0;--bar:#d3dbec;--good:#12805c;--bad:#c2410c;--okc:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1324;--card:#161e35;--ink:#e8ecf6;--mut:#9aa6c0;--line:#27324f;--acc:#6b8cff;--soft:#3a56b0;--bar:#2f3b5c;--good:#34d399;--bad:#fb923c;--okc:#fbbf24}}
:root[data-theme="dark"]{--bg:#0d1324;--card:#161e35;--ink:#e8ecf6;--mut:#9aa6c0;--line:#27324f;--acc:#6b8cff;--soft:#3a56b0;--bar:#2f3b5c;--good:#34d399;--bad:#fb923c;--okc:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(120deg,#0f2a6b,#1b4fd8);color:#fff;padding:18px 20px 0}
header h1{margin:0;font-size:21px;letter-spacing:.2px}header p{margin:3px 0 12px;font-size:12.5px;opacity:.88}
.tabs{display:flex;gap:4px;overflow-x:auto}.tabs button{background:transparent;color:#dbe5ff;border:0;padding:9px 16px;font:600 13px inherit;font-family:inherit;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--bg);color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:16px 14px 28px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:22px;color:var(--acc)}.kpi span{font-size:11.5px;color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 2px;font-size:14px}.sub{margin:0 0 9px;font-size:11.5px;color:var(--mut)}
.br{display:grid;grid-template-columns:112px 1fr 70px;gap:8px;align-items:center;margin:6px 0;font-size:12.5px}
.bt{background:var(--line);height:15px;border-radius:4px;overflow:hidden}.bt i{display:block;height:100%;background:var(--bar);border-radius:4px}
.bt i.m{background:var(--soft)}.bt i.h{background:var(--acc)}.br b{text-align:right;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 13px;font:12.5px inherit;font-family:inherit;cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:560px}
th{background:var(--acc);color:#fff;text-align:left;padding:7px 9px;font-weight:600}td{padding:7px 9px;border-bottom:1px solid var(--line)}
td.G{color:var(--good);font-weight:600}td.O{color:var(--okc);font-weight:600}td.R{color:var(--bad);font-weight:600}tr.hl td:first-child{font-weight:700;color:var(--acc)}
ul{margin:4px 0 0;padding-left:18px}li{margin:4px 0}.lg li::marker{color:var(--good)}.tr li::marker{color:var(--bad)}
.foot{font-size:11.5px;color:var(--mut);margin-top:6px}
@media(max-width:480px){.br{grid-template-columns:88px 1fr 62px}.g{grid-template-columns:1fr}}
</style></head><body>
<header><h1>NEXA Market &amp; Showroom Intelligence</h1>
<p>Competitor benchmarking &bull; Mystery shopper study &bull; Product lineup &nbsp;|&nbsp; Kartik &ndash; MBA Marketing Analytics, DSM DTU &nbsp;|&nbsp; Marketing Intern, Maruti Suzuki NEXA (Jun&ndash;Aug 2026)</p>
<div class="tabs" id="tabs"></div></header>
<main id="v"></main>
<script>
const L=[['Baleno','Premium Hatchback','Petrol / CNG','1197',89.7,22.35,5,'Premium hatch, high fuel efficiency'],
['Fronx','Compact SUV Coupe','Petrol / Turbo / CNG','1197 / 998',100.1,21.79,5,'Boosterjet turbo, SUV styling'],
['Grand Vitara','Mid-Size SUV','Petrol / Hybrid / CNG','1462 / 1490',116,27.97,5,'Strong hybrid + AllGrip AWD'],
['Jimny','Lifestyle Off-Roader','Petrol','1462',104.8,16.94,4,'ALLGRIP PRO 4x4'],
['XL6','Premium MPV','Petrol / CNG','1462',103,20.9,6,'Captain seats'],
['Invicto','Premium MPV','Strong Hybrid','1987',186,23.24,7,'Flagship MPV'],
['Ignis','Urban Compact Hatch','Petrol','1197',83,20.89,5,'Urban SUV styling'],
['e Vitara','Electric SUV','Electric','Battery',174,null,5,'543 km range, 61 kWh LFP battery']];
const C={hatch:{t:'Hatchback: Baleno vs i20, Glanza, Altroz',r:[['Baleno',5.99,9.17,22.94,2],['Hyundai i20',6.00,10.63,20,0],['Toyota Glanza',6.46,9.64,22.94,0],['Tata Altroz',6.30,10.80,18.5,0]],
n:'Altroz mileage is the midpoint of the 18-19 km/l range.',
w:['Lowest entry price and lowest top-end price in the segment','Joint-best petrol mileage (22.94 km/l) with 360 camera and HUD','4-star Bharat NCAP, ahead of the i20 (3-star)'],
l:['Altroz leads on safety (5-star NCAP) and CNG choice (6 variants)','i20 adds sunroof, 10-inch digital cluster, Bose audio and rear disc brakes','No diesel option and no TPMS']},
suv:{t:'Mid-size SUV: Grand Vitara vs 6 rivals',r:[['Grand Vitara',10.77,19.57,27.97,2],['Maruti Victoris',10.50,19.99,28.65,1],['Hyundai Creta',10.91,20.42,21.8,0],['Kia Seltos',10.99,19.99,21,0],['Tata Sierra',11.49,21.29,21.26,0],['Toyota Hyryder',10.99,19.99,27.97,0],['Honda Elevate',11.60,16.67,16.92,0]],
n:'Seltos mileage is an estimate in the source data.',
w:['Strong hybrid (27.97 km/l), CNG and AWD: Creta, Seltos, Sierra and Elevate offer none of these','Top variant is cheaper than 5 of 6 rivals','Widest service network and lowest running cost in the segment'],
l:['No Level 2 ADAS (adaptive cruise, lane keep, collision warning), while 4 rivals offer it','No Bharat NCAP rating; Victoris and Sierra are 5-star','Smallest infotainment screen (9-inch), no powered tailgate or branded audio','No turbo-petrol or diesel; boot trails most rivals']},
mpv:{t:'MPV: XL6 vs Ertiga, Carens, Rumion, Triber',r:[['XL6',11.52,14.48,20.27,2],['Maruti Ertiga',8.80,12.94,20.30,1],['Kia Carens',11.02,12.88,15.7,0],['Toyota Rumion',9.55,13.86,20.17,0],['Renault Triber',6.35,9.72,19.1,0]],
n:'Triber mileage is the midpoint of the 18.2-20 km/l range.',
w:['Only MPV here with a 360 camera; captain seats shared only with Carens','Torque-converter automatic and factory CNG (Carens is manual only)','Best petrol efficiency among the larger MPVs'],
l:['Highest starting and top-end price in the segment','No sunroof, diesel, rear disc brakes or Hill Descent Control (Carens has all of them)','No NCAP rating published']}};
const M=[['Kia Seltos',10,0,'Instant',['Excellent',2],['Engaged, fluent',2],['Strong',2],['Proactive',2],['No follow-up call',0]],
['Maruti Grand Vitara',8,2.5,'2-3 min',['Clean, modern',2],['Polite, slightly scripted',1],['Good; hesitant on comparisons',1],['Proactive',2],['Called next day',2]],
['Nissan Tekton',7,5,'~5 min',['Basic, not tidy',1],['Courteous',2],['Limited (new launch)',1],['Late, near end',1],['Called same day',2]],
['Renault Duster',7,7.5,'7-8 min',['Decent, quiet',1],['Friendly, patient',2],['Good; weak on service/resale',1],['Only on asking',1],['No follow-up call',0]],
['Tata Sierra',6,20,'~20 min',['Cluttered',0],['Pushy / disinterested',0],['Weak',0],['Not offered',0],['Called next day',2]]];
const TD=[['Kia Seltos',9],['Grand Vitara',8],['Renault Duster',7]];
let tab='ov',fuel='All',seg='suv';
const T=[['ov','Overview'],['cp','Competitors'],['sr','Showrooms'],['in','Insights']];
const cl=m=>m==2?'h':m==1?'m':'';
const bars=(a,f)=>{const mx=Math.max(...a.map(r=>r.v));return a.map(r=>`<div class="br"><span>${r.n}</span><span class="bt"><i class="${cl(r.m)}" style="width:${Math.max(r.v/mx*100,2)}%"></i></span><b>${f?f(r):r.v}</b></div>`).join('')};
const card=(t,b,s)=>`<section class="card"><h3>${t}</h3>${s?`<p class="sub">${s}</p>`:''}${b}</section>`;
const kpi=(v,l)=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`;
const chips=(a,c,f)=>`<div class="chips">${a.map(([k,t])=>`<button class="${k==c?'on':''}" onclick="${f}('${k}')">${t}</button>`).join('')}</div>`;
const ul=(a,c)=>`<ul class="${c}">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const ts=k=>{tab=k;render();scrollTo(0,0)},sf=k=>{fuel=k;render()},ss=k=>{seg=k;render()};
function ov(){const v=L.filter(r=>fuel=='All'||r[2].includes(fuel));
const mil=v.filter(r=>r[5]).map(r=>({n:r[0],v:r[5]}));const mx=Math.max(...mil.map(r=>r.v),0);mil.forEach(r=>r.m=r.v==mx?2:0);
const pw=v.map(r=>({n:r[0],v:r[4]}));const pm=Math.max(...pw.map(r=>r.v),0);pw.forEach(r=>r.m=r.v==pm?2:0);
return `<div class="kp">${kpi(8,'NEXA models')}${kpi(5,'Fuel types')}${kpi('27.97','Best mileage (km/l, Grand Vitara hybrid)')}${kpi('543 km','e Vitara max range')}${kpi('186 PS','Max power (Invicto hybrid)')}${kpi(11,'Grand Vitara variants')}</div>
${chips([['All','All'],['Petrol','Petrol'],['CNG','CNG'],['Hybrid','Hybrid'],['Turbo','Turbo'],['Electric','Electric']],fuel,'sf')}
<div class="g">${card('Fuel efficiency (km/l)',bars(mil,r=>r.v.toFixed(2)),'Best petrol or hybrid figure per model. e Vitara is electric, so it is not shown here.')}${card('Power output (PS)',bars(pw,r=>r.v),'Hybrid models show combined output; e Vitara converted from 128 kW.')}</div>
${card('NEXA lineup',`<div class="w"><table><tr><th>Model</th><th>Segment</th><th>Fuel</th><th>Engine (cc)</th><th>Power (PS)</th><th>Seats</th><th>Key USP</th></tr>${v.map(r=>`<tr class="${r[0]=='Grand Vitara'?'hl':''}"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[6]}</td><td>${r[7]}</td></tr>`).join('')}</table></div>`)}`}
function cp(){const s=C[seg],mx=Math.max(...s.r.map(r=>r[2]))*1.03;
const rg=s.r.map(r=>`<div class="br"><span>${r[0]}</span><span class="bt"><i class="${cl(r[4])}" style="margin-left:${r[1]/mx*100}%;width:${(r[2]-r[1])/mx*100}%"></i></span><b style="font-size:11px">${r[1]}-${r[2]}</b></div>`).join('');
const ml=s.r.map(r=>({n:r[0],v:r[3],m:r[4]}));
return `${chips([['hatch','Hatchback'],['suv','Mid-size SUV'],['mpv','MPV']],seg,'ss')}<div class="g">${card('Price band (Rs lakh, ex-showroom)',rg,'Bar runs from starting to top variant price. Approximate 2026 prices.')}${card('Petrol / best mileage (km/l)',bars(ml),s.n)}</div>
<div class="g">${card('Where Maruti leads',ul(s.w,'lg'),s.t)}${card('Where Maruti trails',ul(s.l,'tr'),'Gaps worth raising with product and marketing teams')}</div>`}
const lv=['R','O','G'];
function sr(){const sc=M.map(r=>({n:r[0].split(' ')[0]+' '+r[0].split(' ')[1],v:r[1],m:r[0].startsWith('Maruti')?2:0}));
const wt=M.map(r=>({n:r[0].split(' ')[0],v:Math.max(r[2],.3),m:r[0].startsWith('Maruti')?2:0,t:r[3]}));
return `<div class="kp">${kpi(5,'Showrooms visited')}${kpi('10/10','Top score (Kia)')}${kpi('8/10','Maruti score, rank 2 of 5')}${kpi('7.6','Average score')}${kpi('2-3 min','Maruti greeting time')}</div>
<div class="g">${card('Overall showroom score (/10)',bars(sc),'Mystery shopper walk-in experience')}${card('Time to be attended (minutes)',bars(wt,r=>r.t),'Lower is better. Kia greeted instantly.')}</div>
${card('Experience scorecard',`<div class="w"><table><tr><th>Showroom</th><th>Score</th><th>Ambience</th><th>Staff</th><th>Product knowledge</th><th>Test drive</th><th>Follow-up</th></tr>${M.map(r=>`<tr class="${r[0].startsWith('Maruti')?'hl':''}"><td>${r[0]}</td><td>${r[1]}/10</td>${r.slice(4).map(c=>`<td class="${lv[c[1]]}">${c[0]}</td>`).join('')}</tr>`).join('')}</table></div>`,'Green = strong, amber = partial, red = gap. Dealer names removed.')}
<div class="g" style="margin-top:12px">${card('Test drive score (/10)',bars(TD.map(r=>({n:r[0],v:r[1],m:r[0]=='Grand Vitara'?2:0}))),'Seltos led on engine, handling and cabin; Grand Vitara stood out for hybrid efficiency and comfort.')}${card('What the visits showed',ul(['Kia set the benchmark: instant greeting, deep product knowledge, proactive test drive','Maruti was clean, quick and proactive, but the pitch felt scripted and hesitated on head-to-head comparisons','Tata lost points on a 20-minute wait, clutter and weak knowledge','Lead capture was consistent everywhere; follow-up calls were not'],'lg'))}</div>`}
function ins(){return `<div class="g">${card('Key insights',ul(['Customer experience, not just product or price, separates showrooms: the best score (Kia, 10/10) came from response time, knowledge and a proactive test drive.','Grand Vitara wins on efficiency, powertrain choice and price, but is missing ADAS and a safety rating, which 4 of 6 rivals now offer.','Maruti showrooms did well overall (8/10) and the car held up on the road; the bigger opportunity is a less scripted, comparison-ready sales pitch.'],'lg'))}${card('Recommendations',ul(['Acknowledge every walk-in within 1-2 minutes (the Grand Vitara visit shows it is achievable).','Train sales staff on head-to-head comparisons against Seltos, Creta and Sierra.','Offer a test drive early and proactively; keep enough demo cars.','Close the ADAS and safety-rating gap in messaging until the product catches up.','Track follow-up calls as a showroom KPI.'],'tr'))}</div>
${card('About this project',`<p style="margin:0 0 6px"><b>Analyst:</b> Kartik, MBA (Marketing Analytics), Delhi School of Management, DTU. <b>Role:</b> Marketing Intern, Maruti Suzuki India Ltd. NEXA, Jun&ndash;Aug 2026.</p><p style="margin:0 0 6px"><b>Scope:</b> competitor benchmarking of NEXA models against 8+ rivals across hatchback, mid-size SUV and MPV segments; mystery shopper visits to 5 showrooms with a test drive review; product knowledge reports on all 8 NEXA models.</p><p style="margin:0 0 6px"><b>Skills shown:</b> Excel data cleaning, structured comparison, dashboard design, customer-experience analysis, recommendations for stakeholders.</p><p class="foot">Specifications and prices are approximate public figures (2026). Showroom findings reflect single visits by the analyst and are indicative, not statistically representative.</p>`)}`}
function render(){document.getElementById('tabs').innerHTML=T.map(([k,t])=>`<button class="${k==tab?'on':''}" onclick="ts('${k}')">${t}</button>`).join('');
document.getElementById('v').innerHTML={ov,cp,sr,in:ins}[tab]()}
render();
</script></body></html>
